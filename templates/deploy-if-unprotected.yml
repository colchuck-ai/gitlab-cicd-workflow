spec:
  inputs:
    hotfix-branch-re:
      type: string
      description: re2 regex for identifying hotfix branches, which are exempt from non-prod deployments
      default: /^hotfix-.+$/
    environment-deployment-tier:
      type: string
      description: Non-production deployment tier (other, development, or testing)
      options:
        - other
        - development
        - testing
    environment-name:
      type: string
      description: Name of the GitLab environment
    when:
      type: string
      description: When to trigger the job (on_success or manual)
      default: on_success
      options:
        - on_success
        - manual
---
.deploy-if-unprotected:$[[ inputs.environment-deployment-tier ]]:$[[ inputs.environment-name ]]:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "false" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ $[[ inputs.hotfix-branch-re ]]
      when: $[[ inputs.when ]]
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH !~ $[[ inputs.hotfix-branch-re ]] && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH !~ $[[ inputs.hotfix-branch-re ]]
      when: $[[ inputs.when ]]
  environment:
    deployment_tier: $[[ inputs.environment-deployment-tier ]]
    name: $[[ inputs.environment-name ]]
